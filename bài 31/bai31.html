
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 31 - Tính tổng</title>
</head>
<body>
    <h1>TÍNH TỔNG CÁC SỐ CHIA HẾT CHO 3</h1>

    <form onsubmit="handleSubmit(event)">
        <label>Số đầu:</label>
        <input type="number" id="soDau" required>
        <br><br>

        <label>Số cuối:</label>
        <input type="number" id="soCuoi" required>
        <br><br>

        <button type="submit">Tính tổng</button>
    </form>

    <h3 id="ketqua"></h3>

    <script>
        function handleSubmit(event) {
            event.preventDefault();

            const soDau = Number(document.getElementById("soDau").value);
            const soCuoi = Number(document.getElementById("soCuoi").value);

            if (soDau > soCuoi) {
                document.getElementById("ketqua").innerHTML =
                    "Số đầu phải nhỏ hơn hoặc bằng số cuối!";
                return;
            }

            let tong = 0;

            for (let i = soDau; i <= soCuoi; i++) {
                if (i % 3 == 0) {
                    tong = tong + i;
                }
            }

            document.getElementById("ketqua").innerHTML =
                "Tổng các số chia hết cho 3 là: " + tong;
        }
    </script>
</body>
</html>
